<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paw Home icons</title>
  <!-- Development sheet of the icon set (icons.js); not shipped to the game. -->
  <style>
    body { margin: 0; padding: 24px; background: #fff6ec; color: #4a2f23; font: 14px/1.4 system-ui, sans-serif; }
    h1 { font-size: 18px; margin: 0 0 16px; }
    .grid { display: flex; flex-wrap: wrap; }
    .cell { width: 112px; margin: 0 12px 16px 0; padding: 12px 6px; background: #fff; border-radius: 18px;
            box-shadow: 0 3px 0 #f0d9c2; text-align: center; }
    .cell img { width: 48px; height: 48px; display: block; margin: 0 auto 6px; }
    .cell.big img { width: 96px; height: 96px; }
    .cell code { font-size: 12px; }
  </style>
</head>
<body>
  <h1>Paw Home icon set (48 × 48, shown at 1× and 2×)</h1>
  <div class="grid" id="grid"></div>
  <script src="icons.js"></script>
  <script>
    const grid = document.getElementById("grid");
    function cell(name, mood, big) {
      const d = document.createElement("div");
      d.className = "cell" + (big ? " big" : "");
      d.appendChild(Icons.img(name, { mood }));
      const c = document.createElement("code");
      c.textContent = mood ? name + " · " + mood : name;
      d.appendChild(c);
      grid.appendChild(d);
    }
    for (const n of Icons.names()) if (n !== "cat") cell(n);
    for (const m of Icons.moods) cell("cat", m);
    for (const n of ["cat", "paw", "adopt", "coin"]) cell(n, null, true);
  </script>
</body>
</html>
