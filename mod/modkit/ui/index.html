<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Paw Home</title>
<link rel="stylesheet" href="coui://inzoi/mod/inzoi-fonts.css">
<link rel="stylesheet" href="style.css">
<style>
/* In-game shell for mod/ui. The game's scaffold rules: html/body stay transparent and
   overflow hidden, never pointer-events:none on html/body. #app-root is the window that
   window.js drags and persists; app.js sizes it for the phone, computer or launcher view. */
html, body { width: 100%; height: 100%; background: transparent !important; overflow: hidden; font-size: 15px; }
#app-root { top: 380px; left: 24px; width: 88px; height: 88px; }
</style>
</head>
<body>
<div id="app-root">
  <div id="title-bar">
    <span id="title-text"></span>
    <div id="title-buttons">
      <span id="minimize-btn">_</span>
      <span id="close-btn">X</span>
    </div>
  </div>
  <div id="content">
    <main class="app" id="app" aria-live="polite"></main>
    <div class="toasts" id="toasts" role="status"></div>
  </div>
</div>
<!-- Required by the game, in this order: cohtml.js, inzoi-sdk.js, window.js; then ours. -->
<script src="coui://inzoi/cohtml.js"></script>
<script src="coui://inzoi/mod/inzoi-sdk.js"></script>
<script src="window.js"></script>
<script src="icons.js"></script>
<script src="bridge.js"></script>
<script src="app.js"></script>
</body>
</html>
