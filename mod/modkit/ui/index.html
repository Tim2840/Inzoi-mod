<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Paw Home</title>
<link rel="stylesheet" href="coui://inzoi/mod/inzoi-fonts.css">
<link rel="stylesheet" href="style.css">
<style>
/* In-game shell for mod/ui. The game's scaffold rules: html/body stay transparent and
   overflow hidden, never pointer-events:none on html/body. The panel lives in #app-root,
   which window.js makes draggable and resizable. */
html, body { width: 100%; height: 100%; background: transparent !important; overflow: hidden;
             font-family: var(--inzoi-font-ui); font-size: 15px; }
#app-root { position: absolute; top: 120px; left: 80px; width: 420px; height: 640px;
            display: flex; flex-direction: column; overflow: hidden;
            background: var(--bg); color: var(--text); border-radius: 12px;
            box-shadow: 0 8px 28px rgba(0,0,0,0.45); }
#title-bar { display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
             padding: 4px 10px; background: rgba(0,0,0,0.55); color: #fff; cursor: move;
             user-select: none; -webkit-user-select: none; }
#title-text { font-size: 14px; font-weight: bold; }
#title-buttons { display: flex; align-items: center; gap: 6px; }
#minimize-btn, #close-btn { cursor: pointer; font-size: 13px; font-weight: bold; line-height: 1.4;
             background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
             color: #fff; border-radius: 3px; padding: 1px 7px; }
#minimize-btn { display: none; }
#content { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; }
#resize-handle { position: absolute; bottom: 0; right: 0; width: 18px; height: 18px; cursor: nwse-resize; }
</style>
</head>
<body>
<div id="app-root">
  <div id="title-bar">
    <span id="title-text">Paw Home</span>
    <div id="title-buttons">
      <span id="minimize-btn">_</span>
      <span id="close-btn">X</span>
    </div>
  </div>
  <div id="content">
    <main class="app" id="app" aria-live="polite"></main>
    <div class="toasts" id="toasts" role="status"></div>
  </div>
</div>
<!-- Required by the game, in this order: cohtml.js, inzoi-sdk.js, window.js; then ours. -->
<script src="coui://inzoi/cohtml.js"></script>
<script src="coui://inzoi/mod/inzoi-sdk.js"></script>
<script src="window.js"></script>
<script src="bridge.js"></script>
<script src="app.js"></script>
</body>
</html>
